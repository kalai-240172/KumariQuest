<!DOCTYPE html>
<html>
<head>
    <title>Login | KumariQuest</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #ccfbf1, #fff7ed);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #0f766e;
        }

        p {
            text-align: center;
            color: #6b7280;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0f766e;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #115e59;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0f766e;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🌴 KumariQuest</h1>

    <p>Login to continue your journey</p>

    <form method="POST">

        {% csrf_token %}

        {% if error %}
    <p style="color: red; text-align: center; margin: 10px 0;">
        ❌ {{ error }}
    </p>
{% endif %}

        <label>Username</label>
<input
    type="text"
    name="username"
    placeholder="Enter your username"
    required
>

        <label>Password</label>

<div style="position: relative;">
    <input 
        type="password" 
        name="password" 
        id="loginPassword"
        placeholder="Enter your password" 
        required
        style="padding-right: 45px;"
    >

    <button 
        type="button"
        onclick="togglePassword()"
        id="toggleButton"
        style="
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: auto;
            margin: 0;
            padding: 5px;
            background: none;
            color: #0f766e;
            font-size: 18px;
        "
    >👁️</button>
</div>

        <button type="submit">
            Login
        </button>

    </form>

    <p style="text-align:center; margin-top:20px;">
    Don't have an account?
    <a href="/login/register/" style="color:#0f766e;">
        Create Account
    </a>
</p>

    

</div>

<script>
function togglePassword() {
    const password = document.getElementById("loginPassword");
    const button = document.getElementById("toggleButton");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "🙈";
    } else {
        password.type = "password";
        button.textContent = "👁️";
    }
}
</script>

</body>
</html>
